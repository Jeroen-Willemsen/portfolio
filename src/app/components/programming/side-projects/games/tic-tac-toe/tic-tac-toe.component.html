<div animate.enter="fade-in" class="game">
  <h2 style="margin-top: 0">Tic-Tac-Toe</h2>
  <div aria-label="Tic-tac-toe board" class="board" role="grid">
    @for (cell of board; track $index; let idx = $index) {
      <button
        (click)="makeMove(idx)"
        [attr.aria-label]="'Cell ' + (idx + 1) + ': ' + (cell ?? 'empty')"
        [class.win]="winningLine.includes(idx)"
        [disabled]="!!cell || !!winner"
        class="cell"
        type="button">
        {{ cell }}
      </button>
    }
  </div>
  @if (winner) {
    <div aria-live="polite" class="result">
      @if (winner === 'Draw') {
        <p>It's a draw</p>
      } @else {
        <p>Player {{ winner }} wins</p>
      }
      <button (click)="newGame()">New game</button>
    </div>
  } @else {
    <div class="turn">
      Player {{ playerTurn }}'s turn
    </div>
  }
</div>
