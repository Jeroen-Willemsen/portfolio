<div animate.enter="fade-in" class="test">
  <h2 style="margin-top: 0">Typing Speed Test</h2>
  <p aria-label="Text to type" class="text-to-type">
    @for (c of characters; track $index) {
      <span [class]="c.state">{{ c.char }}</span>
    }
  </p>
  <textarea
    (input)="onTextInput()"
    [(ngModel)]="enteredText"
    [disabled]="isFinished"
    aria-label="Type the text above here"
    autocapitalize="off"
    autocomplete="off"
    placeholder="Start typing to begin the timer..."
    spellcheck="false">
  </textarea>
  <p aria-live="polite">
    Time left: {{ timeLeft }}s &middot; {{ wpm }} WPM &middot; {{ accuracy }}% accuracy
  </p>
  @if (isFinished) {
    <div>
      <p>Done! You typed {{ wpm }} words per minute with {{ accuracy }}% accuracy.</p>
      <button (click)="resetTest()" type="button">Try again</button>
    </div>
  }
</div>
