<div animate.enter="fade-in">
  <div class="tabs" role="tablist">
    <button
      (click)="selectTab('app-popular-science')"
      [attr.aria-selected]="selectedTab === 'app-popular-science'"
      [class.active]="selectedTab === 'app-popular-science'"
      role="tab">
      Popular science articles
    </button>
    <button
      (click)="selectTab('app-blogs')"
      [attr.aria-selected]="selectedTab === 'app-blogs'"
      [class.active]="selectedTab === 'app-blogs'"
      role="tab">
      Blogs
    </button>
    @if (availableLanguages.length > 1) {
      <fieldset class="language-filter">
        <legend class="visually-hidden">Filter by language</legend>
        @for (language of availableLanguages; track language) {
          <input #box
                 (change)="toggleLanguage(language, box.checked)"
                 [checked]="selectedLanguages.has(language)"
                 [id]="'lang-' + language"
                 type="checkbox"/>
          <label [for]="'lang-' + language">{{ language }}</label>
        }
      </fieldset>
    }
  </div>
  <div class="tab-content" role="tabpanel">
    @if (selectedTab === 'app-popular-science') {
      <app-popular-science [articles]="popsciComponentInput"></app-popular-science>
    } @else {
      <app-blogs [articles]="blogsComponentInput"></app-blogs>
    }
  </div>
</div>
